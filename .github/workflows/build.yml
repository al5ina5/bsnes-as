name: build

on:
  push:
    branches: [master, stable, unstable, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, stable, unstable, main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev libgtksourceview-3.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxv-dev \
            libsdl2-dev \
            libasound2-dev libao-dev libpulse-dev libopenal-dev \
            libudev-dev \
            libgomp1 \
            git ca-certificates

      - name: Build (GTK3, no Discord, all backends)
        run: |
          cd bsnes
          make -j"$(nproc)" \
            hiro=gtk3 \
            discord=false \
            build=performance_debug \
            local=false \
            openmp=true \
            ruby='video.glx video.glx2 video.xvideo video.xshm audio.oss audio.alsa audio.openal audio.pulseaudio audio.pulseaudiosimple audio.ao input.xlib input.udev'

      - name: Upload bsnes binary
        uses: actions/upload-artifact@v4
        with:
          name: bsnes-linux-gtk3
          path: bsnes/out/bsnes
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Win32, no Discord)
        shell: cmd
        run: |
          cd bsnes
          nmake /f nall/GNUmakefile ^
            platform=windows ^
            hiro=windows ^
            discord=false ^
            build=performance_debug ^
            local=false ^
            openmp=true

      - name: Upload bsnes binary
        uses: actions/upload-artifact@v4
        with:
          name: bsnes-windows-x64
          path: bsnes/out/bsnes.exe
          if-no-files-found: warn